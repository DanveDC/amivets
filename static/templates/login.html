<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AmiVets</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=24">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <div class="login-card">
        <div class="login-card-header">
            <h1 class="login-brand">AmiVets</h1>
            <p class="login-subtitle">Sistema de Gestión Veterinaria</p>
        </div>

        <form id="loginForm" class="login-form">
            <div id="loginError" class="login-error" role="alert" aria-live="assertive"></div>

            <div class="login-field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ingresá tu usuario">
            </div>

            <div class="login-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
        </form>
    </div>
    <script src="/static/js/auth.js"></script>
</body>

</html>
