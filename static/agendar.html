<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar Consulta — AmiVets</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=25">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
</head>
<body class="qr-booking-page">
  <div class="card">
    <div class="card-header">
      <div class="logo">🐾</div>
      <h1>Agendar Consulta</h1>
      <p>Completá el formulario para reservar tu turno</p>
    </div>

    <div id="formView" class="card-body">
      <div id="alertBox" class="alert"></div>

      <p class="section-title">Turno</p>

      <div class="form-group">
        <label for="selectVet">Veterinario</label>
        <select id="selectVet" required>
          <option value="">Cargando...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="selectFecha">Fecha</label>
        <input type="date" id="selectFecha" required />
      </div>

      <div class="form-group" id="slotsGroup" style="display:none;">
        <label>Horario disponible</label>
        <div id="slotsGrid" class="slots-grid"></div>
        <input type="hidden" id="horaSeleccionada" />
      </div>

      <hr class="section-divider" />
      <p class="section-title">Tus datos</p>

      <div class="form-group">
        <label for="nombreCliente">Nombre completo</label>
        <input type="text" id="nombreCliente" placeholder="Ej: María García" required />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono / WhatsApp</label>
        <input type="tel" id="telefono" placeholder="Ej: 09912345678" required />
      </div>

      <hr class="section-divider" />
      <p class="section-title">Tu mascota</p>

      <div class="form-group">
        <label for="nombreMascota">Nombre de la mascota</label>
        <input type="text" id="nombreMascota" placeholder="Ej: Rex" required />
      </div>

      <div class="form-group">
        <label for="tipoMascota">Tipo de mascota</label>
        <select id="tipoMascota">
          <option value="">Seleccionar...</option>
          <option value="Perro">Perro</option>
          <option value="Gato">Gato</option>
          <option value="Ave">Ave</option>
          <option value="Conejo">Conejo</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="motivo">Motivo de consulta (opcional)</label>
        <textarea id="motivo" placeholder="Ej: Vacunación anual, revisión general..."></textarea>
      </div>

      <button class="btn-submit" id="btnSubmit" onclick="enviarCita()">Confirmar turno</button>
    </div>

    <div id="successView" class="success-view">
      <div class="success-icon">✅</div>
      <h2>¡Turno solicitado!</h2>
      <p id="successDetail"></p>
      <p class="success-note">
        Te contactaremos para confirmar tu turno.
      </p>
    </div>
  </div>

  <script>
    const API = '';  // same origin

    let horariosVet = [];
    let selectedSlot = null;

    async function init() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('selectFecha').min = today;
      document.getElementById('selectFecha').value = today;
      await cargarVeterinarios();
    }

    async function cargarVeterinarios() {
      const sel = document.getElementById('selectVet');
      sel.innerHTML = '<option value="">Cargando...</option>';
      hideAlert();

      try {
        const res = await fetch(`${API}/api/admin/supabase/veterinarios`);
        if (!res.ok) {
          sel.innerHTML = '<option value="">No se pudo cargar</option>';
          showAlert('No se pudo cargar la lista de veterinarios. Intentá de nuevo.', 'error', { onRetry: cargarVeterinarios });
          return;
        }
        const vets = await res.json();
        if (!Array.isArray(vets) || vets.length === 0) {
          sel.innerHTML = '<option value="">Sin veterinarios disponibles</option>';
          showAlert('No hay veterinarios disponibles por el momento.', 'info');
          return;
        }
        sel.innerHTML = '<option value="">Seleccioná un veterinario...</option>' +
          '<option value="0">Cualquier veterinario disponible</option>' +
          vets.filter(v => v.activo).map(v =>
            `<option value="${v.id}">${v.nombre}</option>`
          ).join('');
      } catch (e) {
        sel.innerHTML = '<option value="">No se pudo cargar</option>';
        showAlert('Error al cargar veterinarios. Verificá tu conexión.', 'error', { onRetry: cargarVeterinarios });
      }
    }

    document.getElementById('selectVet').addEventListener('change', cargarHorarios);
    document.getElementById('selectFecha').addEventListener('change', renderSlots);

    async function cargarHorarios() {
      const vetId = document.getElementById('selectVet').value;
      horariosVet = [];
      selectedSlot = null;
      document.getElementById('horaSeleccionada').value = '';
      hideAlert();

      const grid = document.getElementById('slotsGrid');
      const group = document.getElementById('slotsGroup');

      if (vetId === '') {
        group.style.display = 'none';
        return;
      }

      group.style.display = 'block';
      grid.innerHTML = '<p class="empty-state">Cargando horarios...</p>';

      try {
        const url = vetId === '0'
          ? `${API}/api/admin/supabase/horarios`
          : `${API}/api/admin/supabase/horarios?amivets_usuario_id=${vetId}`;
        const res = await fetch(url);
        if (!res.ok) {
          group.style.display = 'none';
          showAlert('No se pudieron cargar los horarios del veterinario. Intentá de nuevo.', 'error', { onRetry: cargarHorarios });
          return;
        }
        const horarios = await res.json();
        horariosVet = Array.isArray(horarios) ? horarios.filter(h => h.activo) : [];
        renderSlots();
      } catch (e) {
        group.style.display = 'none';
        showAlert('Error al cargar los horarios del veterinario.', 'error', { onRetry: cargarHorarios });
      }
    }

    function renderSlots() {
      const fechaVal = document.getElementById('selectFecha').value;
      const vetId = document.getElementById('selectVet').value;
      const grid = document.getElementById('slotsGrid');
      const group = document.getElementById('slotsGroup');

      selectedSlot = null;
      document.getElementById('horaSeleccionada').value = '';

      if (!vetId || !fechaVal || horariosVet.length === 0) {
        group.style.display = 'none';
        return;
      }

      // JS Date from "YYYY-MM-DD" is UTC — add T00:00 to keep local day
      const date = new Date(fechaVal + 'T00:00:00');
      const jsDow = date.getDay(); // 0=Sun..6=Sat
      // Convert to 0=Mon..6=Sun
      const dayIndex = jsDow === 0 ? 6 : jsDow - 1;

      const dayHorarios = horariosVet.filter(h => h.dia_semana === dayIndex);

      if (dayHorarios.length === 0) {
        grid.innerHTML = '<p class="empty-state">Sin horarios disponibles para ese día.</p>';
        group.style.display = 'block';
        return;
      }

      const slots = [];
      dayHorarios.forEach(h => {
        const [sh, sm] = h.hora_inicio.split(':').map(Number);
        const [eh, em] = h.hora_fin.split(':').map(Number);
        const dur = h.duracion_consulta_minutos || 60;
        let cur = sh * 60 + sm;
        const end = eh * 60 + em;
        while (cur + dur <= end) {
          const hh = String(Math.floor(cur / 60)).padStart(2, '0');
          const mm = String(cur % 60).padStart(2, '0');
          slots.push(`${hh}:${mm}`);
          cur += dur;
        }
      });

      if (slots.length === 0) {
        grid.innerHTML = '<p class="empty-state">Sin horarios disponibles para ese día.</p>';
      } else {
        grid.innerHTML = slots.map(s =>
          `<button type="button" class="slot-btn" onclick="selectSlot('${s}', this)">${s}</button>`
        ).join('');
      }
      group.style.display = 'block';
    }

    function selectSlot(hora, btn) {
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSlot = hora;
      document.getElementById('horaSeleccionada').value = hora;
      hideAlert();
    }

    async function enviarCita() {
      const vetId = document.getElementById('selectVet').value;
      const fecha = document.getElementById('selectFecha').value;
      const hora = document.getElementById('horaSeleccionada').value;
      const nombre = document.getElementById('nombreCliente').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const mascota = document.getElementById('nombreMascota').value.trim();
      const tipo = document.getElementById('tipoMascota').value;
      const motivo = document.getElementById('motivo').value.trim();

      if (vetId === '') { showAlert('Seleccioná un veterinario.', 'error'); return; }
      if (!fecha) { showAlert('Seleccioná una fecha.', 'error'); return; }
      if (!hora) { showAlert('Seleccioná un horario disponible.', 'error'); return; }
      if (!nombre) { showAlert('Ingresá tu nombre completo.', 'error'); return; }
      if (!telefono) { showAlert('Ingresá tu teléfono.', 'error'); return; }
      if (!mascota) { showAlert('Ingresá el nombre de tu mascota.', 'error'); return; }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const res = await fetch(`${API}/api/admin/supabase/citas-qr`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amivets_usuario_id: vetId === '0' ? null : parseInt(vetId),
            fecha_cita: fecha,
            hora_cita: hora,
            nombre_cliente: nombre,
            telefono,
            nombre_mascota: mascota,
            tipo_mascota: tipo || null,
            motivo: motivo || null,
          }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Error ${res.status}`);
        }

        const vetNombre = vetId === '0'
          ? 'el equipo de AmiVets'
          : (document.getElementById('selectVet').selectedOptions[0]?.text || '');
        document.getElementById('successDetail').textContent =
          `Tu turno con ${vetNombre} el ${formatFecha(fecha)} a las ${hora} h fue registrado con éxito.`;
        document.getElementById('formView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';

      } catch (e) {
        showAlert('No se pudo registrar el turno: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Confirmar turno';
      }
    }

    function showAlert(msg, type, { onRetry } = {}) {
      const box = document.getElementById('alertBox');
      box.className = `alert alert-${type}`;
      box.innerHTML = '';
      box.appendChild(document.createTextNode(msg));
      if (onRetry) {
        const retryBtn = document.createElement('button');
        retryBtn.type = 'button';
        retryBtn.className = 'alert-retry-btn';
        retryBtn.textContent = 'Reintentar';
        retryBtn.addEventListener('click', onRetry);
        box.appendChild(retryBtn);
      }
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideAlert() {
      document.getElementById('alertBox').style.display = 'none';
    }

    function formatFecha(str) {
      const [y, m, d] = str.split('-');
      return `${d}/${m}/${y}`;
    }

    init();
  </script>
</body>
</html>
