<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar Cita — Amivets</title>

  <!-- Supabase JS SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ── Reset & Variables ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-primary:   #2563eb;
      --color-primary-d: #1d4ed8;
      --color-accent:    #10b981;
      --color-bg:        #f1f5f9;
      --color-card:      #ffffff;
      --color-text:      #1e293b;
      --color-muted:     #64748b;
      --color-border:    #cbd5e1;
      --color-error:     #ef4444;
      --color-success:   #10b981;
      --radius:          12px;
      --shadow:          0 4px 24px rgba(0,0,0,.08);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* ── Header ───────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 480px;
      width: 100%;
    }
    .header .logo {
      width: 64px; height: 64px;
      background: var(--color-primary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      font-size: 30px;
    }
    .header h1 { font-size: 1.6rem; font-weight: 700; color: var(--color-text); }
    .header p  { font-size: .9rem; color: var(--color-muted); margin-top: 4px; }

    /* ── Card ─────────────────────────────────────────── */
    .card {
      background: var(--color-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 20px;
      max-width: 480px;
      width: 100%;
    }

    /* ── Form Elements ────────────────────────────────── */
    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--color-border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--color-text);
      background: #fff;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }

    /* Select arrow */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾';
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--color-muted);
      font-size: 1.1rem;
    }

    /* Horas grid */
    #horas-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .hora-btn {
      padding: 10px 4px;
      border: 1.5px solid var(--color-border);
      border-radius: 8px;
      background: #fff;
      font-size: .85rem;
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
      text-align: center;
      transition: all .15s;
    }
    .hora-btn:hover  { border-color: var(--color-primary); color: var(--color-primary); }
    .hora-btn.selected {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .hora-btn.ocupada {
      background: #f1f5f9;
      color: var(--color-border);
      cursor: not-allowed;
      text-decoration: line-through;
    }

    #horas-placeholder {
      font-size: .85rem;
      color: var(--color-muted);
      padding: 12px 0;
      text-align: center;
    }

    /* Button */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 6px;
    }
    .btn-submit:hover   { background: var(--color-primary-d); }
    .btn-submit:active  { transform: scale(.98); }
    .btn-submit:disabled {
      background: var(--color-border);
      cursor: not-allowed;
      transform: none;
    }

    /* Alerts */
    .alert {
      padding: 14px 16px;
      border-radius: 8px;
      font-size: .9rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .alert.show    { display: block; }

    /* Loading spinner inline */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success screen */
    #success-screen {
      display: none;
      text-align: center;
      padding: 32px 16px;
    }
    #success-screen .check {
      font-size: 3.5rem;
      margin-bottom: 12px;
    }
    #success-screen h2 { font-size: 1.4rem; margin-bottom: 8px; }
    #success-screen p  { color: var(--color-muted); font-size: .9rem; line-height: 1.5; }
    .detail-box {
      background: var(--color-bg);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      text-align: left;
    }
    .detail-box p { font-size: .85rem; color: var(--color-text); margin-bottom: 6px; }
    .detail-box p:last-child { margin-bottom: 0; }
    .detail-box strong { color: var(--color-primary); }

    @media (min-width: 520px) {
      .card { padding: 32px 28px; }
      #horas-grid { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🐾</div>
    <h1>Amivets</h1>
    <p>Agenda tu cita veterinaria en línea</p>
  </div>

  <div class="card">

    <!-- Alertas globales -->
    <div id="alert-error"   class="alert error"></div>
    <div id="alert-success" class="alert success"></div>

    <!-- ── Formulario ── -->
    <form id="cita-form">

      <div class="form-group">
        <label for="nombre_cliente">Tu Nombre Completo</label>
        <input type="text" id="nombre_cliente" placeholder="Ej. Ana García" required />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono de Contacto</label>
        <input type="tel" id="telefono" placeholder="Ej. +57 300 123 4567" required />
      </div>

      <div class="form-group">
        <label for="nombre_mascota">Nombre de tu Mascota</label>
        <input type="text" id="nombre_mascota" placeholder="Ej. Firulais" required />
      </div>

      <div class="form-group">
        <label for="tipo_mascota">Tipo de Mascota</label>
        <div class="select-wrap">
          <select id="tipo_mascota" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="Perro">🐶 Perro</option>
            <option value="Gato">🐱 Gato</option>
            <option value="Ave">🐦 Ave</option>
            <option value="Conejo">🐰 Conejo</option>
            <option value="Reptil">🦎 Reptil</option>
            <option value="Otro">🐾 Otro</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="veterinario_id">Veterinario</label>
        <div class="select-wrap">
          <select id="veterinario_id" required>
            <option value="" disabled selected>Cargando veterinarios…</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="fecha_cita">Fecha de la Cita</label>
        <input type="date" id="fecha_cita" required />
      </div>

      <div class="form-group">
        <label>Hora Disponible</label>
        <div id="horas-placeholder">Selecciona un veterinario y una fecha primero.</div>
        <div id="horas-grid" style="display:none;"></div>
        <input type="hidden" id="hora_cita" required />
      </div>

      <button type="submit" class="btn-submit" id="btn-submit" disabled>
        Confirmar Cita
      </button>

    </form>

    <!-- ── Pantalla de éxito ── -->
    <div id="success-screen">
      <div class="check">✅</div>
      <h2>¡Cita Agendada!</h2>
      <p>Tu solicitud fue recibida. Te contactaremos al número proporcionado para confirmarte la cita.</p>
      <div class="detail-box" id="resumen-cita"></div>
    </div>

  </div><!-- /card -->

  <script>
  // ── Configuración Supabase ──────────────────────────────────────────────────
  const SUPABASE_URL = "https://twvytfictllxylhuynrw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_M2FZrIRjwxWV12xB1gUrzg_AfNs2aPl";
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── DOM refs ────────────────────────────────────────────────────────────────
  const form           = document.getElementById('cita-form');
  const selVet         = document.getElementById('veterinario_id');
  const inpFecha       = document.getElementById('fecha_cita');
  const horasGrid      = document.getElementById('horas-grid');
  const horasPlaceholder = document.getElementById('horas-placeholder');
  const inpHora        = document.getElementById('hora_cita');
  const btnSubmit      = document.getElementById('btn-submit');
  const alertError     = document.getElementById('alert-error');
  const alertSuccess   = document.getElementById('alert-success');
  const successScreen  = document.getElementById('success-screen');

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function showError(msg) {
    alertError.textContent = msg;
    alertError.classList.add('show');
    alertSuccess.classList.remove('show');
    setTimeout(() => alertError.classList.remove('show'), 6000);
  }
  function showSuccess(msg) {
    alertSuccess.textContent = msg;
    alertSuccess.classList.add('show');
    alertError.classList.remove('show');
  }

  // Rango de horas entre hora_inicio y hora_fin con step de duracion_minutos
  function generarSlots(horaInicio, horaFin, duracion) {
    const slots = [];
    const [hI, mI] = horaInicio.split(':').map(Number);
    const [hF, mF] = horaFin.split(':').map(Number);
    let cur = hI * 60 + mI;
    const fin = hF * 60 + mF;
    while (cur + duracion <= fin) {
      const h = String(Math.floor(cur / 60)).padStart(2, '0');
      const m = String(cur % 60).padStart(2, '0');
      slots.push(`${h}:${m}`);
      cur += duracion;
    }
    return slots;
  }

  // Número de día de la semana (0=Lunes … 6=Domingo) a partir de "YYYY-MM-DD"
  function diaSemana(fechaStr) {
    const [y, mo, d] = fechaStr.split('-').map(Number);
    const jsDay = new Date(y, mo - 1, d).getDay(); // 0=Dom … 6=Sáb
    return jsDay === 0 ? 6 : jsDay - 1;             // 0=Lun … 6=Dom
  }

  // ── 1. Cargar veterinarios ──────────────────────────────────────────────────
  async function cargarVeterinarios() {
    const { data, error } = await sb
      .from('veterinarios')
      .select('id, nombre, especialidad')
      .eq('activo', true)
      .order('nombre');

    if (error) { showError('No se pudieron cargar los veterinarios.'); return; }

    selVet.innerHTML = '<option value="" disabled selected>Selecciona un veterinario</option>';

    // Opción de consulta general (asignación automática)
    const optGeneral = document.createElement('option');
    optGeneral.value = 'general';
    optGeneral.textContent = '🐾 Consulta General (asignación automática)';
    selVet.appendChild(optGeneral);

    data.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = v.especialidad ? `${v.nombre} — ${v.especialidad}` : v.nombre;
      selVet.appendChild(opt);
    });
  }

  // ── 2. Cargar horas disponibles ─────────────────────────────────────────────
  async function cargarHoras() {
    const vetId = selVet.value;
    const fecha = inpFecha.value;

    // Limpiar selección previa
    inpHora.value = '';
    horasGrid.style.display = 'none';
    horasPlaceholder.style.display = 'block';
    horasPlaceholder.textContent = 'Calculando disponibilidad…';
    updateSubmitBtn();

    if (!vetId || !fecha) {
      horasPlaceholder.textContent = 'Selecciona un veterinario y una fecha primero.';
      return;
    }

    // Bloquear fechas pasadas
    const hoy = new Date().toISOString().split('T')[0];
    if (fecha < hoy) {
      horasPlaceholder.textContent = '⚠️ No puedes agendar en fechas pasadas.';
      return;
    }

    const dia = diaSemana(fecha);
    const esGeneral = vetId === 'general';

    // Obtener horarios: si es general, traemos TODOS los vets activos
    let horariosQuery = sb.from('horarios_veterinarios')
      .select('veterinario_id, hora_inicio, hora_fin, duracion_consulta_minutos')
      .eq('dia_semana', dia)
      .eq('activo', true);

    if (!esGeneral) {
      horariosQuery = horariosQuery.eq('veterinario_id', vetId);
    }

    const { data: horarios, error: errH } = await horariosQuery;

    if (errH || !horarios?.length) {
      horasPlaceholder.textContent = esGeneral
        ? '😔 No hay veterinarios con horario disponible ese día.'
        : '😔 El veterinario no tiene horario disponible ese día.';
      return;
    }

    // Agrupar slots por veterinario (para consulta general)
    // Un slot está disponible si al menos 1 vet no tiene cita en esa hora
    const slotsPorVet = {};
    horarios.forEach(h => {
      const vid = h.veterinario_id;
      if (!slotsPorVet[vid]) slotsPorVet[vid] = [];
      slotsPorVet[vid] = slotsPorVet[vid].concat(
        generarSlots(h.hora_inicio.slice(0,5), h.hora_fin.slice(0,5), h.duracion_consulta_minutos)
      );
    });

    // Todos los slots posibles (unión)
    let todosSlots = [...new Set(Object.values(slotsPorVet).flat())].sort();

    // Citas ya ocupadas ese día
    let citasQuery = sb.from('citas_agendadas')
      .select('veterinario_id, hora_cita')
      .eq('fecha_cita', fecha)
      .in('estado', ['pendiente', 'sincronizada']);

    if (!esGeneral) {
      citasQuery = citasQuery.eq('veterinario_id', vetId);
    }

    const { data: ocupadasData } = await citasQuery;
    const ocupadasPorVet = {};
    (ocupadasData || []).forEach(c => {
      const vid = c.veterinario_id;
      if (!ocupadasPorVet[vid]) ocupadasPorVet[vid] = new Set();
      ocupadasPorVet[vid].add(c.hora_cita.slice(0,5));
    });

    // Determinar disponibilidad de cada slot
    const slotsDisponibles = new Set();
    todosSlots.forEach(slot => {
      for (const vid in slotsPorVet) {
        if (!slotsPorVet[vid].includes(slot)) continue;
        const ocupadasVet = ocupadasPorVet[vid] || new Set();
        if (!ocupadasVet.has(slot)) {
          slotsDisponibles.add(slot); // Al menos un vet libre
          break;
        }
      }
    });

    // Renderizar grid
    horasGrid.innerHTML = '';
    todosSlots.forEach(slot => {
      const libre = slotsDisponibles.has(slot);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hora-btn' + (libre ? '' : ' ocupada');
      btn.textContent = slot;
      btn.dataset.hora = slot;
      if (libre) {
        btn.addEventListener('click', () => seleccionarHora(slot));
      }
      horasGrid.appendChild(btn);
    });

    horasPlaceholder.style.display = 'none';
    horasGrid.style.display = 'grid';

    if (slotsDisponibles.size === 0) {
      horasPlaceholder.textContent = '😔 No hay horas disponibles para ese día.';
      horasPlaceholder.style.display = 'block';
      horasGrid.style.display = 'none';
    }
  }

  function seleccionarHora(hora) {
    document.querySelectorAll('.hora-btn').forEach(b => b.classList.remove('selected'));
    const btn = document.querySelector(`.hora-btn[data-hora="${hora}"]`);
    if (btn) btn.classList.add('selected');
    inpHora.value = hora;
    updateSubmitBtn();
  }

  function updateSubmitBtn() {
    const allFilled =
      document.getElementById('nombre_cliente').value.trim() &&
      document.getElementById('telefono').value.trim() &&
      document.getElementById('nombre_mascota').value.trim() &&
      document.getElementById('tipo_mascota').value &&
      selVet.value &&
      inpFecha.value &&
      inpHora.value;
    btnSubmit.disabled = !allFilled;
  }

  // ── 3. Enviar cita ──────────────────────────────────────────────────────────
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<span class="spinner"></span> Enviando…';

    const vetRaw = selVet.value;
    const payload = {
      nombre_cliente:  document.getElementById('nombre_cliente').value.trim(),
      telefono:        document.getElementById('telefono').value.trim(),
      nombre_mascota:  document.getElementById('nombre_mascota').value.trim(),
      tipo_mascota:    document.getElementById('tipo_mascota').value,
      veterinario_id:  vetRaw === 'general' ? null : parseInt(vetRaw),
      fecha_cita:      inpFecha.value,
      hora_cita:       inpHora.value + ':00',
      estado:          'pendiente',
    };

    const { error } = await sb.from('citas_agendadas').insert(payload);

    if (error) {
      showError('Ocurrió un error al agendar: ' + error.message);
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Confirmar Cita';
      return;
    }

    // Mostrar pantalla de éxito
    form.style.display = 'none';
    successScreen.style.display = 'block';

    const vetNombre = vetRaw === 'general'
      ? 'Asignación automática'
      : selVet.options[selVet.selectedIndex].textContent;
    document.getElementById('resumen-cita').innerHTML = `
      <p>🐾 <strong>Mascota:</strong> ${payload.nombre_mascota} (${payload.tipo_mascota})</p>
      <p>👤 <strong>Veterinario:</strong> ${vetNombre}</p>
      <p>📅 <strong>Fecha:</strong> ${payload.fecha_cita}</p>
      <p>⏰ <strong>Hora:</strong> ${payload.hora_cita.slice(0,5)}</p>
      <p>📞 <strong>Contacto:</strong> ${payload.telefono}</p>
    `;
  });

  // ── Eventos de cambio ────────────────────────────────────────────────────────
  selVet.addEventListener('change',  cargarHoras);
  inpFecha.addEventListener('change', cargarHoras);

  // Validación en tiempo real para el botón
  ['nombre_cliente','telefono','nombre_mascota','tipo_mascota'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateSubmitBtn);
  });

  // Bloquear fechas pasadas en el input date
  const hoy = new Date().toISOString().split('T')[0];
  inpFecha.min = hoy;

  // ── Init ─────────────────────────────────────────────────────────────────────
  cargarVeterinarios();
  </script>
</body>
</html>
